<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"><title>Hesabat — Media Monitorinq</title><meta name="theme-color" content="#07111f"><link rel="icon" href="./assets/img/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./assets/css/app.css?v=97"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><section class="page-head report-head"><div><h1>Hesabat</h1><p>Tarix aralığı üzrə ümumi monitorinq göstəriciləri.</p></div><div class="toolbar report-toolbar"><select class="select" id="report-period"><option value="month">Bu ay</option><option value="today">Bu gün</option><option value="6m">Son 6 ay</option><option value="1y">1 il</option><option value="10y">10 il</option><option value="all">Bütün tarix</option><option value="custom">Tarix aralığı</option></select><button class="btn" id="apply">Tətbiq et</button><select class="select scope-filter-pending" id="organization-filter" aria-label="Təşkilat filtri"></select><input class="input" type="date" id="from"><input class="input" type="date" id="to"></div></section><section class="grid grid-4" id="metrics"></section><section class="grid grid-2 report-panels" style="margin-top:16px"><div class="card report-card"><div class="section-head"><div><h2>Mənbələr</h2><p>Platformalar üzrə nəticə sayı</p></div></div><div id="platforms"></div></div><div class="card report-card"><div class="section-head"><div><h2>Uyğunluq bölgüsü</h2><p>Tapılan materialın təşkilata uyğunluq dərəcəsi</p></div></div><div id="priorities"></div></div></section></main></div><nav class="bottom-nav" id="bottom-nav"></nav><div id="toast-stack"></div><script>
(function(){
  try{
    if(sessionStorage.getItem('mm.shell.role')!=='user')return;
    var pairs=[['sidebar','mm.shell.sidebar'],['topbar','mm.shell.topbar'],['bottom-nav','mm.shell.bottom']];
    pairs.forEach(function(x){var el=document.getElementById(x[0]),html=sessionStorage.getItem(x[1]);if(el&&html)el.innerHTML=html;});
    var page=(location.pathname.split('/').pop()||'app.html').toLowerCase();
    document.querySelectorAll('#bottom-nav a,#sidebar .nav a').forEach(function(a){
      var href=(a.getAttribute('href')||'').split('?')[0].split('#')[0].replace(/^\.\//,'').toLowerCase();
      a.classList.toggle('active',href===page);
    });
  }catch(e){}
})();
</script><script type="module" src="./assets/js/reports.js?v=86"></script></body></html>
