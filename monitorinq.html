<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monitorinq — Media Monitorinq</title><meta name="theme-color" content="#07111f"><link rel="icon" href="./assets/img/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><section class="page-head monitor-head"><div><h1>Monitorinq</h1><p>Aşkarlanan materiallar, AI uyğunluğu və orijinal mənbələr.</p></div><div class="toolbar monitor-filters"><select class="select" id="period"><option value="today">Bu gün</option><option value="month" selected>Bu ay</option><option value="6m">Son 6 ay</option><option value="1y">1 il</option><option value="10y">10 il</option><option value="all">Bütün tarix</option><option value="custom">Tarix aralığı</option></select><input class="input monitor-date" type="date" id="date-from" aria-label="Başlanğıc tarixi"><input class="input monitor-date" type="date" id="date-to" aria-label="Son tarix"><select class="select" id="platform"><option value="">Bütün platformalar</option><option>YouTube</option><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>LinkedIn</option><option>X</option><option>Web</option></select><select class="select" id="sentiment"><option value="">Bütün tonlar</option><option value="negative">Mənfi</option><option value="neutral">Neytral</option><option value="positive">Müsbət</option></select><select class="select scope-filter-pending" id="organization-filter" aria-label="Təşkilat filtri"></select></div></section><div class="mention-list" id="list"></div><div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div></main></div><nav class="bottom-nav" id="bottom-nav"></nav><div id="viewer" class="media-viewer hidden"><div style="display:flex;justify-content:flex-end"><button class="icon-btn" id="viewer-close" aria-label="Bağla">✕</button></div><div id="viewer-stage" style="display:grid;place-items:center;overflow:hidden;min-height:0"><img id="viewer-img" alt="Screenshot"></div><div class="media-actions"><button class="btn secondary" id="zoom-in">＋</button><button class="btn secondary" id="zoom-out">－</button><button class="btn secondary" id="share-media">Paylaş</button><a class="btn secondary" id="save-media" download>Yadda saxla</a></div></div><div id="modal-root"></div><div id="toast-stack"></div><script type="module" src="./assets/js/monitoring.js"></script></body></html>
