name: Media Monitorinq Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; YouTube monitoru buraxılır."
            exit 0
          fi

      - name: YouTube and internal monitor worker
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 55 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d '{"mode":"scheduled","debug":false,"quick_youtube_comments":true,"verify_existing":false}' \
            "https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker"

  web-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: media-monitor-web
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; Web monitoru buraxılır."
            exit 0
          fi

      - name: Web and news gateway
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_DIRECT_ONLY: '1'
          NEWS_SOURCE_BATCH: '12'
          NEWS_DOMAIN_SEARCH_BATCH: '12'
          NEWS_BROAD_QUERY_LIMIT: '2'
        run: node scripts/news-gateway.mjs
