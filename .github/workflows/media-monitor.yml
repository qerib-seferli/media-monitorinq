name: Media Monitorinq Worker

on:
  schedule:
    # Canlı monitorinq əsas prioritetdir. Ağır arxiv işləri eyni dəqiqədə başlamır.
    - cron: '*/15 * * * *'
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '37 * * * *'
    - cron: '23 */2 * * *'
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Workflow səviyyəsində qlobal concurrency QƏSDƏN yoxdur. Əvvəlki qlobal kilid
# 15 dəqiqəlik run-ları 16+ dəqiqəlik backfill arxasında növbəyə salırdı.
# Hər ağır job aşağıda öz shard concurrency qrupu ilə qorunur.

jobs:
  youtube-monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; YouTube monitoru buraxılır."
            exit 0
          fi

      - name: YouTube and internal monitor worker
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          # Edge Function-un 55s platform limitinə yaxınlaşmamaq üçün aktiv təşkilatlar
          # 15 dəqiqəlik rotasiya ilə kiçik paketlərdə yoxlanır. Növbəti schedule qalanları götürür.
          ROTATION_BUCKET=$(( $(date +%s) / 900 ))
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 105 \
            --retry 2 \
            --retry-delay 4 \
            --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d "{\"mode\":\"scheduled\",\"debug\":false,\"quick_youtube_comments\":true,\"verify_existing\":false,\"refilter_existing\":true,\"organization_shard_count\":1,\"organization_shard_index\":0,\"organization_batch\":6,\"organization_rotation_bucket\":${ROTATION_BUCKET}}" \
            "https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker"

  youtube-global-rotation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; qlobal YouTube rotasiyası buraxılır."
            exit 0
          fi

      - name: Global YouTube district rotation
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          ROTATION_BUCKET=$(( $(date +%s) / 3600 ))
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 1 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d "{\"mode\":\"scheduled\",\"debug\":false,\"quick_youtube_comments\":false,\"force_youtube\":true,\"include_archived\":true,\"organization_shard_count\":1,\"organization_shard_index\":0,\"organization_batch\":4,\"organization_rotation_bucket\":${ROTATION_BUCKET},\"youtube_query_limit\":1,\"verify_existing\":false}" \
            "https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker"

  web-fast-watch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: media-monitor-web-fast-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; sürətli Web monitoru buraxılır."
            exit 0
          fi

      - name: Configured websites fast watch
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_GLOBAL_ORGS: '1'
          NEWS_ORG_SHARD_COUNT: '5'
          NEWS_ORG_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_ORG_BATCH: '1'
          NEWS_ORG_ROTATION_MINUTES: '15'
          NEWS_DIRECT_ONLY: '1'
          NEWS_REFILTER_EXISTING: '1'
          NEWS_GATEWAY_BUDGET_MS: '210000'
          NEWS_SOURCE_SHARD_COUNT: '5'
          NEWS_SOURCE_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_SOURCE_BATCH: '40'
          NEWS_DOMAIN_SEARCH_BATCH: '6'
          NEWS_BROAD_QUERY_LIMIT: '0'
          NEWS_FAST_LINK_LIMIT: '8'
          NEWS_FAST_FEED_LIMIT: '10'
          NEWS_MAX_INGEST_ITEMS: '100'
          NEWS_MAX_ENRICH_ITEMS: '6'
          NEWS_MAX_SCREENSHOTS: '0'
        run: node scripts/news-gateway.mjs

  web-archive-discovery:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: media-monitor-web-archive-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; Web arxiv monitoru buraxılır."
            exit 0
          fi

      - name: Web archive discovery
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_GLOBAL_ORGS: '1'
          NEWS_ORG_SHARD_COUNT: '5'
          NEWS_ORG_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_ORG_BATCH: '1'
          NEWS_ORG_ROTATION_MINUTES: '15'
          NEWS_DIRECT_ONLY: '0'
          NEWS_GATEWAY_BUDGET_MS: '540000'
          # Yalnız archive-discovery shard 0 mövcud Web nəticələrini cari sərt filtrlə
          # yenidən yoxlayır. Düzgün arxiv qalır, həqiqi yanlış material relevance_score=0 olur.
          NEWS_REFILTER_EXISTING: '1'
          NEWS_SOURCE_SHARD_COUNT: '5'
          NEWS_SOURCE_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_SOURCE_BATCH: '40'
          NEWS_DOMAIN_SEARCH_BATCH: '0'
          NEWS_BROAD_QUERY_LIMIT: '4'
          NEWS_MAX_INGEST_ITEMS: '140'
          NEWS_MAX_ENRICH_ITEMS: '8'
          NEWS_MAX_SCREENSHOTS: '1'
        run: node scripts/news-gateway.mjs

  web-recent-priority-backfill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: media-monitor-web-recent-priority-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; 2020–cari il prioritet Web backfill buraxılır."
            exit 0
          fi

      - name: Recent priority Web backfill 2020-current
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_GLOBAL_ORGS: '1'
          NEWS_ORG_SHARD_COUNT: '5'
          NEWS_ORG_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_ORG_BATCH: '1'
          NEWS_ORG_ROTATION_MINUTES: '15'
          NEWS_DIRECT_ONLY: '0'
          NEWS_GATEWAY_BUDGET_MS: '720000'
          NEWS_DEEP_BACKFILL: '1'
          NEWS_RECENT_PRIORITY: '1'
          NEWS_REFILTER_EXISTING: '0'
          NEWS_ARCHIVE_YEAR_START: '2020'
          NEWS_SOURCE_SHARD_COUNT: '5'
          NEWS_SOURCE_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_SOURCE_BATCH: '40'
          NEWS_DOMAIN_SEARCH_BATCH: '6'
          NEWS_BROAD_QUERY_LIMIT: '5'
          NEWS_BING_PAGE_LIMIT: '2'
          NEWS_MAX_INGEST_ITEMS: '140'
          NEWS_MAX_ENRICH_ITEMS: '6'
          NEWS_MAX_SCREENSHOTS: '1'
          NEWS_SITEMAP_INDEX_LIMIT: '10'
          NEWS_SITEMAP_URL_LIMIT: '500'
          NEWS_SITEMAP_PROBE_LIMIT: '20'
        run: node scripts/news-gateway.mjs

  web-sitemap-archive-crawl:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: media-monitor-web-sitemap-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; sitemap arxiv crawler buraxılır."
            exit 0
          fi

      - name: Sitemap archive crawler 2020-current
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_GLOBAL_ORGS: '1'
          NEWS_ORG_SHARD_COUNT: '5'
          NEWS_ORG_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_ORG_BATCH: '1'
          NEWS_ORG_ROTATION_MINUTES: '15'
          NEWS_DIRECT_ONLY: '0'
          NEWS_GATEWAY_BUDGET_MS: '780000'
          NEWS_DEEP_BACKFILL: '1'
          NEWS_RECENT_PRIORITY: '1'
          NEWS_SITEMAP_FOCUS: '1'
          NEWS_REFILTER_EXISTING: '0'
          NEWS_ARCHIVE_YEAR_START: '2020'
          NEWS_SOURCE_SHARD_COUNT: '5'
          NEWS_SOURCE_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_SOURCE_BATCH: '40'
          NEWS_DOMAIN_SEARCH_BATCH: '0'
          NEWS_BROAD_QUERY_LIMIT: '0'
          NEWS_BING_PAGE_LIMIT: '1'
          NEWS_MAX_INGEST_ITEMS: '180'
          NEWS_MAX_ENRICH_ITEMS: '4'
          NEWS_MAX_SCREENSHOTS: '1'
          NEWS_SITEMAP_INDEX_LIMIT: '12'
          NEWS_SITEMAP_URL_LIMIT: '600'
          NEWS_SITEMAP_PROBE_LIMIT: '45'
        run: node scripts/news-gateway.mjs

  web-deep-backfill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: media-monitor-web-deep-backfill-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET təyin edilməyib; dərin Web arxiv backfill buraxılır."
            exit 0
          fi

      - name: Deep historical Web backfill 2000-2019
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker
          NEWS_GLOBAL_ORGS: '1'
          NEWS_ORG_SHARD_COUNT: '5'
          NEWS_ORG_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_ORG_BATCH: '1'
          NEWS_ORG_ROTATION_MINUTES: '15'
          NEWS_DIRECT_ONLY: '0'
          NEWS_GATEWAY_BUDGET_MS: '900000'
          NEWS_DEEP_BACKFILL: '1'
          NEWS_RECENT_PRIORITY: '0'
          NEWS_REFILTER_EXISTING: '0'
          NEWS_ARCHIVE_YEAR_START: '2000'
          NEWS_ARCHIVE_YEAR_END: '2019'
          NEWS_SOURCE_SHARD_COUNT: '5'
          NEWS_SOURCE_SHARD_INDEX: ${{ matrix.shard }}
          NEWS_SOURCE_BATCH: '40'
          NEWS_DOMAIN_SEARCH_BATCH: '5'
          NEWS_BROAD_QUERY_LIMIT: '4'
          NEWS_BING_PAGE_LIMIT: '2'
          NEWS_MAX_INGEST_ITEMS: '140'
          NEWS_MAX_ENRICH_ITEMS: '4'
          NEWS_MAX_SCREENSHOTS: '1'
          NEWS_SITEMAP_INDEX_LIMIT: '8'
          NEWS_SITEMAP_URL_LIMIT: '450'
          NEWS_SITEMAP_PROBE_LIMIT: '16'
        run: node scripts/news-gateway.mjs
