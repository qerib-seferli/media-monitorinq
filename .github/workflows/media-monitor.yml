name: Media Monitorinq Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run monitor worker
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "Monitor secret hələ təyin edilməyib; monitor işi uğursuz sayılmadan buraxılır."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d '{"mode":"scheduled"}' \
            "https://xsmahlsqdszxqordgcvt.supabase.co/functions/v1/monitor-worker"
