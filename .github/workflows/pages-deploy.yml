name: GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository-ni al
        uses: actions/checkout@v6

      - name: GitHub Pages-i hazırla
        uses: actions/configure-pages@v5

      - name: Statik saytı paketlə
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: GitHub Pages-ə yayımla
        id: deployment
        uses: actions/deploy-pages@v5
